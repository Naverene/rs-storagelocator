plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

// The jar is named rsstoragelocator-<mod version>-<Minecraft version>-neoforge.jar.
version = "${mod_version}-${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.4, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // Refined Storage from Modrinth's maven. The version is a Modrinth version id (see gradle.properties).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly "maven.modrinth:refined-storage:${rs_modrinth_version}"
    runtimeOnly "maven.modrinth:refined-storage:${rs_modrinth_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            rs_version_range       : rs_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The jars are named rsstoragelocator-<mod version>-<Minecraft version>-neoforge.jar, so players can tell the loaders apart.
tasks.withType(Jar).configureEach {
    archiveVersion.set(project.provider { "${project.version}-neoforge" })
}
