buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

// The jar is named rsstoragelocator-<mod version>-<Minecraft version>-forge.jar.
version = "${mod_version}-${minecraft_version}"
group = mod_group_id
archivesBaseName = mod_id

// Mojang ships Java 8 to end users in 1.16.5, so the mod targets Java 8.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                rsstoragelocator {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                rsstoragelocator {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // Refined Storage from Modrinth's maven. The version is a Modrinth version id (see gradle.properties).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("maven.modrinth:refined-storage:${rs_modrinth_version}") { transitive = false }
    runtimeOnly fg.deobf("maven.modrinth:refined-storage:${rs_modrinth_version}") { transitive = false }
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, rs_version_range: rs_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The jars are named rsstoragelocator-<mod version>-<Minecraft version>-forge.jar, so players can tell the loaders apart.
tasks.withType(Jar).configureEach {
    archiveVersion.set(project.provider { "${project.version}-forge" })
}
