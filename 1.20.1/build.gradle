plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

// The jar is named rsstoragelocator-<mod version>-<Minecraft version>-forge.jar.
version = "${mod_version}-${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'rsstoragelocator'
}

// Mojang ships Java 17 to end users in 1.20.1, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

repositories {
    // Refined Storage from Modrinth's maven. The version is a Modrinth version id (see gradle.properties).
    // Not exclusiveContent: ForgeGradle serves the deobfuscated copy under the same group from its own repository.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("maven.modrinth:refined-storage:${rs_modrinth_version}") { transitive = false }
    runtimeOnly fg.deobf("maven.modrinth:refined-storage:${rs_modrinth_version}") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, rs_version_range: rs_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The jars are named rsstoragelocator-<mod version>-<Minecraft version>-forge.jar, so players can tell the loaders apart.
tasks.withType(Jar).configureEach {
    archiveVersion.set(project.provider { "${project.version}-forge" })
}
